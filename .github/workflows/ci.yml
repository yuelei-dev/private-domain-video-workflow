name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate fixed-library BGM, keyword emphasis, and first-frame contract
        run: npm test
      - name: Validate Node entrypoint
        run: node --check server.mjs
      - name: Validate Python material helpers
        run: python -m py_compile codex-skill/private-domain-short-video/scripts/*.py server-tools/*.py
